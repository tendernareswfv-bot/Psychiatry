  .tag{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 8px;
       font-size:.78rem;color:var(--muted);margin-left:6px}
  .exercise{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--panel)}

  .flash .inner{position:relative;min-height:110px;transition:transform .18s;transform-style:preserve-3d}
  .flash.flipped .inner{transform:rotateY(180deg)}
  .flash .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;
               align-items:center;justify-content:center;text-align:center;padding:12px}
  .flash .back{transform:rotateY(180deg);background:var(--soft);border-radius:8px}

  .pairbox button.hit{background:var(--ok);border-color:var(--ok)}

/* ================= 以下为运行时代码：一般无需修改 ================= */
const LS_KEY = "pnq:" + (PNQ_DATA.meta.title || "page") + ":";
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(LS_KEY+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(LS_KEY+k, JSON.stringify(v)); }catch(e){} },
  clear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith(LS_KEY)).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
};
let xp = store.get("xp", 0), streak = store.get("streak", 0);
let done = store.get("done", {}),       // {exerciseKey: true}
  mastered = store.get("mastered", {}), // {exerciseKey: true}
  wrong = store.get("wrong", []),       // [exerciseKey]
  badges = store.get("badges", []);     // [badgeName]
let wrongSeen = store.get("wrongSeen", false);

const flat = [];
PNQ_DATA.chapters.forEach(c => c.exercises.forEach((e,i)=> flat.push({ch:c.id, i, e})));
const ekey = (ch,i) => ch + ":" + i;

function saveAll(){ store.set("xp",xp); store.set("streak",streak); store.set("done",done);
  store.set("mastered",mastered); store.set("wrong",wrong); store.set("badges",badges);
  store.set("wrongSeen",wrongSeen); }

function award(name){ if(!badges.includes(name)){ badges.push(name); renderBadges(); } }
function addXp(n){ xp += n; $("#xpPill").textContent = "经验值 " + xp; }
function bumpStreak(ok){
  if(ok){ streak++; if(streak>=5) award("连续答对 5 题"); }
  else streak = 0;
  $("#streakPill").textContent = "连续答对 " + streak;
}
function renderBadges(){
  const box = $("#badgeBox");
  box.innerHTML = badges.length ? badges.map(b=>`<span class="badge">${b}</span>`).join("")
                                : `<span class="tag">还没有徽章，开始第一章吧。</span>`;
}
function markDone(key){ if(!done[key]){ done[key]=true; } }
function noteWrong(key){
  if(!wrong.includes(key)) wrong.push(key);
  if(!wrongSeen){ wrongSeen=true; award("直面错题"); }
  renderWrong();
}
function markRight(key){
  wrong = wrong.filter(k=>k!==key); renderWrong();
}
function renderWrong(){
  const box = $("#wrongBox");
  if(!wrong.length){ box.textContent = "暂无错题。答错的题目会自动收录到这里，方便针对性复习。"; return; }
  box.innerHTML = "";
  wrong.forEach(k=>{
    const f = flat.find(x=>ekey(x.ch,x.i)===k); if(!f) return;
    const row = document.createElement("div"); row.className="exercise";
    row.innerHTML = `<p>${esc(f.e.question)}</p><p class="src">${esc(f.e.source)}</p>`;
    const btn = document.createElement("button"); btn.type="button"; btn.textContent="重练此题";
    btn.addEventListener("click",()=>{ showChapter(f.ch); setTimeout(()=>{
      const el = document.querySelector(`[data-ekey="${k}"]`); if(el) el.scrollIntoView({block:"center"}); },50); });
    row.appendChild(btn); box.appendChild(row);
  });
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 练习渲染 ---------- */
function renderExercise(f){
  const e = f.e, key = ekey(f.ch,f.i), wrap = document.createElement("div");
  wrap.className = "exercise" + (done[key] ? " done" : "");
  wrap.dataset.ekey = key; wrap.dataset.type = e.type;
  let inner = `<p><strong>${esc(e.question)}</strong>${e.question.includes("[待核实]")?' <span class="verify">[待核实]</span>':''} <span class="tag">${typeName(e.type)}</span></p>`;
  inner += optionHtml(e, key);
  inner += `<p class="fb" role="status"></p><p class="why">${esc(e.explanation||"")}</p><p class="src">出处：${esc(e.source||"未标注")}</p>`;
  wrap.innerHTML = inner;
  wireExercise(wrap, f, key);
  return wrap;
}
function typeName(t){ return {flashcard:"抽认卡",tf:"判断题",mcq:"单选题",multi:"多选题",fill:"填空题",
  match:"配对题",order:"排序题",classify:"分类题",spoterror:"找出错误",case:"病例题"}[t]||t; }

function optionHtml(e, key){
  const L = (e.options||[]).map((o,i)=>`<label class="opt"><input type="${e.type==="multi"?"checkbox":"radio"}" name="g" value="${esc(o)}">${esc(o)}</label>`).join("");
  switch(e.type){
    case "flashcard":
      return `<div class="flash" tabindex="0" role="button" aria-label="抽认卡，回车翻转">
        <div class="inner"><div class="face front">${esc(e.question)}</div>
        <div class="face back">${esc(e.answer)}</div></div></div>
        <p style="display:none" class="flashback">${esc(e.answer)}</p>
        <p><button type="button" data-act="master">已掌握</button>
           <button type="button" class="ghost" data-act="again">需复习</button></p>`;
    case "tf": case "mcq": case "spoterror": return L + `<p><button type="button" data-act="submit">提交</button></p>`;
    case "multi": return L + `<p><button type="button" data-act="submit">提交</button></p>`;
    case "fill": return `<p><input type="text" aria-label="填空作答" placeholder="输入答案"> <button type="button" data-act="submit">提交</button></p>`;
    case "match": {
      const rights = shuffle((e.pairs||[]).map(p=>p[1]));
      return `<div class="pairbox" data-left="">${(e.pairs||[]).map((p,i)=>
        `<button type="button" data-l="${i}">${esc(p[0])}</button>`).join(" ")}</div>
        <div class="pairbox" data-right="">${rights.map((r,i)=>
        `<button type="button" data-r="${esc(r)}">${esc(r)}</button>`).join(" ")}</div>
        <p><button type="button" data-act="submit">提交</button></p>`;
    }
    case "order": return `<ul class="ordlist">${(e.options||[]).map(o=>
        `<li><span>${esc(o)}</span><span><button type="button" data-mv="-1" aria-label="上移">↑</button>
        <button type="button" data-mv="1" aria-label="下移">↓</button></span></li>`).join("")}</ul>
        <p><button type="button" data-act="submit">提交</button></p>`;
    case "classify": {
      const cats = e.categories||[];
      return `<div class="card"><strong>待分类</strong>
        <div data-drop="__pool__">${(e.items||[]).map(it=>
        `<button type="button" data-item="${esc(it)}">${esc(it)}</button>`).join(" ")}</div></div>`
        + cats.map(c=>`<div class="card" data-cat="${esc(c)}"><strong>${esc(c)}</strong>
        <div data-drop="${esc(c)}"></div></div>`).join("")
        + `<p><button type="button" data-act="submit">提交</button></p>`;
    }
    case "case": {
      const parts = e.parts||[];
      return `<p class="tag">虚构病例，仅供学习</p>` + parts.map((p,i)=>
        `<div class="casepart${i===0?" on":""}"><p>${esc(p.text)}</p>
         ${p.question?`<p><strong>${esc(p.question)}</strong></p>`:""}
         ${(p.options||[]).map(o=>`<label class="opt"><input type="radio" name="case_${String(key).replace(/[^a-zA-Z0-9]/g,"_")}_${i}" value="${esc(o)}">${esc(o)}</label>`).join("")}
         <p class="why" style="display:none">${esc(p.analysis||"")}</p>
         <p><button type="button" data-act="case-next">下一幕</button></p></div>`).join("");
    }
    default: return `<p class="tag">未知题型</p>`;
  }
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function wireExercise(wrap, f, key){
  const e = f.e;
  const fb = wrap.querySelector(".fb");
  const finish = (ok, msg) => {
    wrap.classList.add("done");
    fb.className = "fb " + (ok?"ok":"bad");
    fb.textContent = msg + " " + (ok?"+10 XP":"看看解析，再试一次吧。");
    if(ok){ if(!done[key]) addXp(10); markDone(key); markRight(key); bumpStreak(true);
      if(doneCount(f.ch) >= chapterDoneTarget(f.ch)) onChapterComplete(f.ch); }
    else { noteWrong(key); bumpStreak(false); }
    saveAll();
  };
  if(e.type==="flashcard"){
    const card = wrap.querySelector(".flash");
    const flip = ()=>card.classList.toggle("flipped");
    card.addEventListener("click",flip);
    card.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); flip(); } });
    wrap.querySelector('[data-act="master"]').addEventListener("click",()=>{
      mastered[key]=true; markDone(key); markRight(key); addXp(10); bumpStreak(true); saveAll();
      fb.className="fb ok"; fb.textContent="已标记掌握 +10 XP";
      if(doneCount(f.ch) >= chapterDoneTarget(f.ch)) onChapterComplete(f.ch); });
    wrap.querySelector('[data-act="again"]').addEventListener("click",()=>{
      mastered[key]=false; noteWrong(key); fb.className="fb bad"; fb.textContent="已加入错题回顾，改天再来。"; saveAll(); });
    return;
  }
  if(e.type==="case"){
    const parts = wrap.querySelectorAll(".casepart"); let idx=0;
    wrap.querySelectorAll('[data-act="case-next"]').forEach(btn=>{
      btn.addEventListener("click",()=>{
        const part = btn.closest(".casepart");
        const q = part.querySelector("strong");
        if(q){
          const sel = part.querySelector("input:checked");
          if(!sel){ part.querySelector(".why").style.display="block"; return; }
          part.querySelector(".why").style.display="block";
          if(sel.value === (e.parts[idx].answer||"")){ addXp(10); markRight(key); bumpStreak(true); }
          else { noteWrong(key); bumpStreak(false); }
          saveAll();
        }
        part.classList.remove("on");
        idx++;
        if(idx < parts.length) parts[idx].classList.add("on");
        else { markDone(key); if(doneCount(f.ch) >= chapterDoneTarget(f.ch)) onChapterComplete(f.ch); saveAll(); }
      });
    });
    return;
  }
  const submit = wrap.querySelector('[data-act="submit"]');
  if(!submit) return;
  submit.addEventListener("click",()=>{
    if(e.type==="tf"||e.type==="mcq"||e.type==="spoterror"){
      const sel = wrap.querySelector("input:checked");
      if(!sel){ fb.className="fb bad"; fb.textContent="请先选择一个选项。"; return; }
      finish(sel.value===e.answer, sel.value===e.answer?"答对了。":"不对。");
    } else if(e.type==="multi"){
      const sels = [...wrap.querySelectorAll("input:checked")].map(i=>i.value);
      const ans = (e.answer||[]).slice().sort().join("|");
      const got = sels.slice().sort().join("|");
      if(!sels.length){ fb.className="fb bad"; fb.textContent="请至少选择一项。"; return; }
      finish(got===ans, got===ans?"全部选对。":"有选项不对。");
    } else if(e.type==="fill"){
      const v = wrap.querySelector("input[type=text]").value.trim();
      if(!v){ fb.className="fb bad"; fb.textContent="请先填写答案。"; return; }
      const ok = Array.isArray(e.answer) ? e.answer.includes(v) : v===e.answer;
      finish(ok, ok?"答对了。":"不对。");
    } else if(e.type==="order"){
      const got = [...wrap.querySelectorAll(".ordlist li > span:first-child")].map(s=>s.textContent);
      const ok = got.join("|") === (e.answer||[]).join("|");
      finish(ok, ok?"顺序正确。":"顺序还不对。");
    } else if(e.type==="match"){
      const wrongPairs = [...wrap.querySelectorAll("[data-l]")].filter(b=>!b.classList.contains("hit"));
      if(wrongPairs.length){ finish(false, "还有 "+wrongPairs.length+" 组未配对正确。"); }
      else finish(true, "全部配对正确。");
    } else if(e.type==="classify"){
      const items = [...wrap.querySelectorAll("[data-item]")];
      const wrongN = items.filter(b => b.closest("[data-drop]").dataset.drop !== (e.belongs||{})[b.dataset.item]).length;
      finish(wrongN===0, wrongN===0 ? "全部分类正确。" : "有 "+wrongN+" 项归类不对，对照解析再试一次。");
    }
  });
  if(e.type==="match"){
    let selL=null;
    wrap.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>{
      wrap.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); selL=b;
    }));
    wrap.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
      if(!selL) return;
      const pair = (e.pairs||[])[+selL.dataset.l];
      if(b.dataset.r === pair[1]){ b.classList.add("hit"); selL.classList.add("hit"); selL.classList.remove("sel"); selL=null; }
      else { b.classList.remove("hit"); selL.classList.remove("hit"); }
    }));
  }
  if(e.type==="order"){
    wrap.querySelectorAll("[data-mv]").forEach(b=>b.addEventListener("click",()=>{
      const li=b.closest("li"), list=li.parentElement, d=+b.dataset.mv;
      const j=[...list.children].indexOf(li)+d;
      if(j<0||j>=list.children.length) return;
      list.insertBefore(li, d>0 ? list.children[j].nextSibling : list.children[j]);
    }));
  }
  if(e.type==="classify"){
    let selItem=null;
    wrap.querySelectorAll("[data-item]").forEach(b=>b.addEventListener("click",()=>{
      wrap.querySelectorAll("[data-item]").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); selItem=b;
    }));
    wrap.querySelectorAll("[data-drop]").forEach(z=>z.addEventListener("click",ev=>{
      if(!selItem || ev.target.closest("[data-item]")===selItem) return;
      z.appendChild(selItem); selItem.classList.remove("sel"); selItem=null;
    }));
  }
}

function doneCount(ch){ return PNQ_DATA.chapters.find(c=>c.id===ch).exercises
  .filter((e,i)=>done[ekey(ch,i)]).length; }
function chapterDoneTarget(ch){ return PNQ_DATA.chapters.find(c=>c.id===ch).exercises.length; }

function onChapterComplete(ch){
  const c = PNQ_DATA.chapters.find(x=>x.id===ch);
  award("完成章节：" + c.title);
  addXp(30);
  const sec = document.querySelector(`[data-chapter="${ch}"] .summary`);
  if(sec && !sec.querySelector(".ch-done")){
    const p = document.createElement("p"); p.className="ch-done notice";
    p.textContent = "本章完成！+30 XP。可以回到首页选择下一章，或在错题回顾中巩固。";
    sec.appendChild(p);
  }
}

/* ---------- 章节与首页 ---------- */
function renderChapters(){
  const box = $("#chapters"); box.innerHTML = "";
  PNQ_DATA.chapters.forEach(c=>{
    const sec = document.createElement("article");
    sec.className = "card"; sec.dataset.chapter = c.id;
    sec.innerHTML = `<p><button class="ghost" type="button" data-back>← 返回首页</button></p>
      <h2>${esc(c.title)}</h2>
      <div class="summary"><h2>学习目标</h2><ul class="obj">${(c.objectives||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
      <h2>核心知识速览</h2><ul>${(c.summaryPoints||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
      <h2>互动练习</h2>`;
    const back = sec.querySelector("[data-back]");
    back.addEventListener("click", showHome);
    c.exercises.forEach((e,i)=> sec.appendChild(renderExercise({ch:c.id, i, e})));
    box.appendChild(sec);
  });
}
function renderHome(){
  $("#appTitle").textContent = PNQ_DATA.meta.title || "学习之旅";
  const grid = $("#chapterGrid"); grid.innerHTML = "";
  PNQ_DATA.chapters.forEach(c=>{
    const total = c.exercises.length, d = doneCount(c.id);
    const pct = total ? Math.round(d/total*100) : 0;
    const btn = document.createElement("button"); btn.type="button"; btn.className="ch-card";
    btn.innerHTML = `<strong>${esc(c.title)}</strong><div class="st">完成 ${d}/${total} · ${pct}%</div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
    btn.addEventListener("click",()=>showChapter(c.id));
    grid.appendChild(btn);
  });
}
function showHome(){ $("#home").hidden=false; $("#chapters").hidden=true; $("#mixed").hidden=true;
  document.querySelectorAll("[data-chapter]").forEach(s=>s.hidden=true); renderHome(); }
function showChapter(id){ $("#home").hidden=true; $("#mixed").hidden=true; $("#chapters").hidden=false;
  document.querySelectorAll("[data-chapter]").forEach(s=> s.hidden = (s.dataset.chapter!==id));
  renderHome(); }

/* ---------- 模式 ---------- */
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>{
  const m = b.dataset.mode;
  if(m==="mixed"){ startMixed(); return; }
  const c = PNQ_DATA.chapters.find(x=>x.exercises.some((e,i)=>!done[ekey(x.id,i)])) || PNQ_DATA.chapters[0];
  showChapter(c.id);
}));
$("#mixedBack").addEventListener("click", showHome);
function startMixed(){
  $("#home").hidden=true; $("#chapters").hidden=true; $("#mixed").hidden=false;
  const pool = shuffle(flat.filter(f=>f.e.type!=="case")).slice(0,8);
  $("#mixedTotal").textContent = pool.length;
  const box = $("#mixedBox"); box.innerHTML="";
  pool.forEach(f=> box.appendChild(renderExercise(f)));
}

/* ---------- 重置 ---------- */
const dlg = $("#confirmDlg");
$("#resetBtn").addEventListener("click",()=>dlg.showModal());
$("#dlgCancel").addEventListener("click",()=>dlg.close());
$("#dlgOk").addEventListener("click",()=>{
  store.clear(); xp=0; streak=0; done={}; mastered={}; wrong=[]; badges=[]; wrongSeen=false;
  saveAll(); dlg.close(); location.reload();
});

/* ---------- 启动 ---------- */
document.title = PNQ_DATA.meta.title || document.title;
addXp(0); bumpStreak(true); bumpStreak(false); // 初始化显示
renderBadges(); renderWrong(); renderChapters(); showHome();
</script>
